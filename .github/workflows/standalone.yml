name: Standalone distribution

on:
  workflow_dispatch:
    inputs:
      include_dashboard:
        description: "Prepare dashboard assets; requires complete upstream license notices"
        type: boolean
        default: false
  push:
    paths:
      - "standalone/**"
      - "build-resources/**"
      - "scripts/standalone_assets.py"
      - "*.py"
      - "agent/**"
      - "hermes_cli/**"
      - "tools/**"
      - "gateway/**"
      - "cron/**"
      - "plugins/**"
      - "pm/**"
      - "hermes_platform/**"
      - "tui_gateway/**"
      - "acp_adapter/**"
      - "providers/**"
      - "skills/**"
      - "optional-skills/**"
      - "locales/**"
      - "README.md"
      - "LICENSE"
      - "SOUL.md"
      - "pyproject.toml"
      - "uv.lock"
      - "web/**"
      - "apps/shared/**"
      - "scripts/build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/standalone.yml"
  pull_request:
    paths:
      - "standalone/**"
      - "build-resources/**"
      - "scripts/standalone_assets.py"
      - "*.py"
      - "agent/**"
      - "hermes_cli/**"
      - "tools/**"
      - "gateway/**"
      - "cron/**"
      - "plugins/**"
      - "pm/**"
      - "hermes_platform/**"
      - "tui_gateway/**"
      - "acp_adapter/**"
      - "providers/**"
      - "skills/**"
      - "optional-skills/**"
      - "locales/**"
      - "README.md"
      - "LICENSE"
      - "SOUL.md"
      - "pyproject.toml"
      - "uv.lock"
      - "web/**"
      - "apps/shared/**"
      - "scripts/build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/standalone.yml"

permissions:
  contents: read

jobs:
  web-assets:
    name: Prepare original dashboard assets
    if: github.event_name == 'workflow_dispatch' && inputs.include_dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
      - name: Prepare locked build dependencies
        run: node scripts/build/node-deps.mjs --source . --workspace web --workspace apps/shared
      - name: Compile original dashboard
        env:
          HERMES_WEB_BUILD_THREADS: "2"
          HERMES_WEB_BUILD_MAX_OLD_SPACE_SIZE: "2048"
        run: node scripts/build/web.mjs --source . --icons . --out .build/standalone-web
      - name: Validate receipt and retain source notices
        run: python -I -S standalone/web_assets.py --source . --product .build/standalone-web --output hermes_cli/web_dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-web-assets
          path: hermes_cli/web_dist
          include-hidden-files: true
          if-no-files-found: error
  standalone:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: web-assets
    if: ${{ !cancelled() && (needs.web-assets.result == 'success' || needs.web-assets.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.web-assets.result == 'success'
        with:
          name: standalone-web-assets
          path: hermes_cli/web_dist
      - name: Restore original model and dictionary resources
        run: python -I -S scripts/standalone_assets.py restore
      - name: Fetch pinned dependency archives
        run: python -I -S standalone/vendor.py fetch
      - name: Run standard-library checks with the reviewed inputs
        run: python -I -S standalone/check.py
      - name: Build offline
        run: python -I -S standalone/build.py
      - name: Verify relocated distribution
        run: python -I -S standalone/check.py --artifact dist/hermes.py --artifact-only
      - name: Build optional AST artifact offline
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python -I -S standalone/build.py --minify ast --output dist/hermes-ast.py
      - name: Verify optional AST artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python -I -S standalone/check.py --artifact dist/hermes-ast.py --artifact-only
      - name: Inventory upstream portability boundaries
        run: python -I -S standalone/audit.py --output standalone/.cache/audit.json
